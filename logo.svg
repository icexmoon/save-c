<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="cDrive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c23152"/>
    </linearGradient>
    <linearGradient id="dDrive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#0a2647"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#e94560" stroke-width="2" opacity="0.15"/>
  <!-- Drive C: -->
  <g transform="translate(112, 148)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="170" rx="16" ry="16" fill="url(#cDrive)"/>
    <rect x="20" y="130" width="90" height="12" rx="6" fill="#fff" opacity="0.15"/>
    <rect x="40" y="150" width="50" height="4" rx="2" fill="#fff" opacity="0.1"/>
    <text x="65" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">C:</text>
  </g>
  <!-- Arrow link -->
  <g filter="url(#glow)">
    <line x1="240" y1="233" x2="262" y2="233" stroke="url(#arrowGrad)" stroke-width="8" stroke-linecap="round"/>
    <polygon points="280,233 262,218 262,248" fill="url(#arrowGrad)"/>
  </g>
  <!-- Drive D: -->
  <g transform="translate(270, 148)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="170" rx="16" ry="16" fill="url(#dDrive)"/>
    <rect x="20" y="130" width="90" height="12" rx="6" fill="#fff" opacity="0.08"/>
    <rect x="40" y="150" width="50" height="4" rx="2" fill="#fff" opacity="0.06"/>
    <text x="65" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">D:</text>
  </g>
  <!-- Symlink chain indicator -->
  <g transform="translate(256, 350)" opacity="0.6">
    <g fill="none" stroke="#533483" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12,-8 Q-2,-18 8,-8 Q12,-4 8,0 Q-2,-10 -12,0 Q-16,-4 -12,-8Z"/>
      <path d="M-8,8 Q2,18 12,8 Q16,4 12,0 Q2,10 -8,0 Q-12,4 -8,8Z"/>
    </g>
  </g>
  <!-- Text: save-c -->
  <text x="256" y="418" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="300" fill="#a0a0b8" text-anchor="middle" letter-spacing="4">save-c</text>
  <line x1="160" y1="438" x2="352" y2="438" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <!-- Subtitle -->
  <text x="256" y="462" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="300" fill="#555" text-anchor="middle" letter-spacing="5" opacity="0.5">C: → D: · SYMLINK</text>
</svg>
