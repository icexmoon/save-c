[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "save-c"
version = "1.0.0"
description = "将 C 盘目录迁移到 D 盘并创建软链接，安全释放 C 盘空间"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["disk", "symlink", "space-saver", "windows"]
authors = [
  {name = "icexmoon", email = "icexmoon@qq.com"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/user/save-c"
Source = "https://github.com/user/save-c"

[project.scripts]
savec = "savec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/savec"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

